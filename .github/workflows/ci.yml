name: CI

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v6

      # Installs the vp the project already pins: with no version given, the
      # action reads the vite-plus devDependency and resolves the range through
      # pnpm-lock.yaml. It also provisions Node and pnpm and runs the install,
      # replacing setup-node and pnpm/action-setup.
      # Pinned to an exact tag on purpose: the moving v1 tag is frozen.
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--prefer-offline']

      # Formatting and linting, via oxfmt and oxlint.
      - run: vp check

      - run: vp run typecheck

  Playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--prefer-offline']

      - run: vp pack

      - run: vp exec playwright install --with-deps

      # `vp test` is the built-in Vitest runner, so the Playwright suite has to
      # go through the package.json script.
      - run: vp run test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
