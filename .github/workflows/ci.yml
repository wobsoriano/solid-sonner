name: CI

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v7

      # Sets up vp, Node and pnpm and installs, replacing setup-node and
      # pnpm/action-setup. The vp version is read from the vite-plus dependency.
      # Exact tag on purpose: the moving v1 tag is frozen.
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--prefer-offline']

      # oxfmt and oxlint.
      - run: vp check

      - run: vp run typecheck

  Playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--prefer-offline']

      - run: vp pack

      - run: vp exec playwright install --with-deps

      # `vp test` is the built-in Vitest runner, so the Playwright suite has to
      # go through the package.json script.
      - run: vp run test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
