name: CI

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v7

      # Sets up vp, Node and pnpm and installs, replacing setup-node and
      # pnpm/action-setup. The vp version is read from the vite-plus dependency.
      # Exact tag on purpose: the moving v1 tag is frozen.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--prefer-offline']

      # oxfmt and oxlint.
      - run: vp check

      - run: vp run typecheck

  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--prefer-offline']

      - run: vp pack

      - run: vp exec e2e-web install chromium webkit --with-deps

      - run: vp exec e2e run --reporter list,junit

      - run: vp exec e2e run --reporter list,junit
        env:
          TEST_DIST: '1'

      - run: vp exec e2e run --reporter list,junit
        env:
          TEST_DIST: default

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/results
          if-no-files-found: warn
          retention-days: 30
